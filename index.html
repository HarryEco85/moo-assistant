<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Moo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0B0D12; --surface: #151922; --surface-hi: #1C2130; --line: rgba(255,255,255,.08);
    --ink: #E8ECF3; --muted: #8A93A6; --faint: #586072;
    --a1: #4F8CFF; --a2: #22D3EE; --listen1: #22D3EE; --listen2: #67E8F9; --think1: #8B5CF6; --think2: #C084FC;
    --green: #4ADE80; --amber: #FBBF24; --red: #F87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
  .name { font-weight: 700; font-size: 20px; letter-spacing: .2px; text-transform: lowercase; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: rgba(74,222,128,.14); color: var(--green); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.off { background: rgba(138,147,166,.14); color: var(--muted); }
  .chip.busy { background: rgba(139,92,246,.18); color: var(--think2); }
  header .sp { flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:active { background: var(--surface-hi); color: var(--ink); }

  .hero { display: flex; flex-direction: column; align-items: center; padding: 4px 0 6px; transition: all .3s; }
  .orb-wrap { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .orb { width: 92px; height: 92px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.75) 0, rgba(255,255,255,0) 26%),
                conic-gradient(from var(--spin, 0deg), var(--o1), var(--o2), var(--o1));
    box-shadow: 0 0 46px 6px color-mix(in srgb, var(--o1) 45%, transparent), inset -10px -14px 26px rgba(0,0,0,.35);
    animation: breathe 4s ease-in-out infinite, spin 9s linear infinite; --o1: var(--a1); --o2: var(--a2); }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  body.listening .orb { --o1: var(--listen1); --o2: var(--listen2); animation: pulse 1s ease-in-out infinite, spin 4s linear infinite; }
  body.thinking .orb { --o1: var(--think1); --o2: var(--think2); animation: breathe 1.6s ease-in-out infinite, spin 2s linear infinite; }
  body.speaking .orb { animation: talk .5s ease-in-out infinite, spin 6s linear infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  @keyframes talk { 25% { transform: scale(1.07); } 60% { transform: scale(.98); } }
  .status { color: var(--muted); font-size: 13px; margin-top: 2px; min-height: 18px; }
  body.chatting .orb-wrap { width: 84px; height: 84px; }
  body.chatting .orb { width: 56px; height: 56px; }

  .glance { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 6px 14px 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; min-width: 0; text-align: left; }
  .card small { display: block; font-size: 10px; letter-spacing: .6px; font-weight: 700; color: var(--faint); text-transform: uppercase; }
  .card span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 13px; font-weight: 600; margin-top: 2px; }
  body.chatting .glance { display: none; }

  .approvals { padding: 4px 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .ap { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--amber); border-radius: 12px; padding: 10px 10px 10px 12px; }
  .ap .t { flex: 1; min-width: 0; }
  .ap .t b { display: block; font-size: 14px; font-weight: 600; }
  .ap .t em { display: block; font-style: normal; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-hi); }
  .pill.primary { background: var(--a1); color: var(--bg); }

  .suggest { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 2px; scrollbar-width: none; }
  .suggest::-webkit-scrollbar { display: none; }
  .suggest .pill { white-space: nowrap; }
  body.chatting .suggest { display: none; }

  #chat { flex: 1; overflow-y: auto; padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain; }
  .msg { max-width: 86%; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg.you { align-self: flex-end; background: color-mix(in srgb, var(--a1) 20%, var(--surface-hi)); padding: 9px 13px;
    border-radius: 18px 18px 6px 18px; }
  .msg.moo { align-self: flex-start; font-size: 16.5px; }
  .msg.moo .who { font-size: 11px; font-weight: 700; color: var(--a1); margin-bottom: 1px; }
  .msg.moo .who time { color: var(--faint); font-weight: 400; margin-left: 6px; }
  .msg.moo .replay { margin-left: 6px; color: var(--faint); font-size: 12px; }
  .msg.sys { align-self: center; color: var(--faint); font-size: 12.5px; text-align: center; max-width: 92%; }
  .msg.alert { align-self: stretch; max-width: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px; font-size: 14px; white-space: pre-wrap; }
  .msg.draft { align-self: stretch; max-width: none; background: var(--surface); border-radius: 12px; padding: 10px 12px;
    font-size: 14px; white-space: pre-wrap; }
  .msg.draft small { display: flex; justify-content: space-between; font-weight: 700; color: var(--faint); font-size: 11px;
    letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
  .msg img { max-width: 100%; border-radius: 12px; display: block; }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted);
    animation: dot 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 30% { transform: translateY(-4px); opacity: 1; } 0%, 60%, 100% { opacity: .35; } }

  footer { padding: 6px 12px 10px; }
  .bar { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 5px 5px 8px; transition: box-shadow .2s, border-color .2s; }
  .bar:focus-within { border-color: color-mix(in srgb, var(--a1) 55%, transparent); box-shadow: 0 0 22px -6px var(--a1); }
  .bar input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: inherit; font-size: 16px; padding: 8px 4px; }
  .bar input::placeholder { color: var(--faint); }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  #cam { color: var(--muted); }
  #send { background: var(--surface-hi); display: none; }
  body.typed #send { display: grid; }
  #mic { width: 52px; height: 52px; background: var(--a1); color: var(--bg); box-shadow: 0 4px 18px -4px var(--a1); }
  body.listening #mic { background: var(--listen1); animation: pulse 1s infinite; }

  .pair { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; gap: 10px; }
  .pair h1 { font-size: 22px; margin: 18px 0 0; }
  .pair p { color: var(--muted); margin: 0; max-width: 320px; }
  body.unpaired .pair { display: flex; }
  body.unpaired .app { display: none !important; }
  .app { display: contents; }
  .sheet { position: fixed; inset: auto 0 0 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .25s; box-shadow: 0 -10px 40px rgba(0,0,0,.5); z-index: 5; }
  .sheet.open { transform: none; }
  .sheet h3 { margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .toggle { width: 46px; height: 28px; border-radius: 999px; background: var(--surface-hi); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: .2s; }
  .toggle.on { background: var(--a1); } .toggle.on::after { left: 21px; background: var(--bg); }
</style>
</head>
<body class="unpaired">
  <div class="pair">
    <div class="orb-wrap"><div class="orb"></div></div>
    <h1>Hello</h1>
    <p>To connect, open Moo on your PC, go to <b>⚙ Settings → Phone app</b>, and scan the QR code with your phone's camera.</p>
  </div>

  <div class="app">
    <header>
      <div class="name" id="name">moo</div>
      <div class="chip off" id="chip"><i></i><span>Connecting</span></div>
      <div class="sp"></div>
      <button class="icon-btn" id="menuBtn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <div class="hero" id="hero">
      <div class="orb-wrap" id="orbBtn"><div class="orb"></div></div>
      <div class="status" id="status">Tap the mic and talk</div>
    </div>

    <div class="glance" id="glance">
      <button class="card" data-ask="What's my diary looking like today?"><small>Next up</small><span id="gNext">…</span></button>
      <button class="card" data-ask="Anything important in my inbox?"><small>Inbox</small><span id="gInbox">…</span></button>
      <button class="card" data-ask="What reminders have I got?"><small>Reminder</small><span id="gRem">…</span></button>
    </div>
    <div class="approvals" id="approvals"></div>
    <div class="suggest" id="suggest">
      <button class="pill" data-ask="Summarise my day">Summarise my day</button>
      <button class="pill" data-ask="Prep me for tomorrow">Prep me for tomorrow</button>
      <button class="pill" data-ask="Anything important in my inbox?">My inbox</button>
      <button class="pill" data-ask="What's going on in VH3 today?">VH3 today</button>
    </div>

    <div id="chat"></div>

    <footer>
      <div class="bar">
        <button class="round" id="cam" aria-label="Send a photo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <input id="text" type="text" placeholder="Ask Moo anything" autocomplete="off" enterkeyhint="send">
        <button class="round" id="send" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5 5.5 12z"/></svg>
        </button>
        <button class="round" id="mic" aria-label="Talk">
          <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    </footer>
  </div>

  <div class="sheet" id="sheet">
    <h3>Settings</h3>
    <div class="row"><span>Speak replies out loud</span><button class="toggle on" id="tVoice"></button></div>
    <div class="row"><span>Auto-send when I stop talking</span><button class="toggle on" id="tAuto"></button></div>
    <div class="row"><span>Unpair this phone</span><button class="pill" id="unpair">Unpair</button></div>
    <div class="row"><span style="color:var(--faint);font-size:13px">To install: browser menu ⋮ → Add to Home screen</span><button class="pill" id="closeSheet">Done</button></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("moo_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("moo_" + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem("moo_" + k); } catch {} },
  };

  // ---------- pairing (from the QR code on the PC) ----------
  if (location.hash.length > 3) {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("u") && h.get("k") && h.get("t")) {
      store.set("cfg", { u: h.get("u"), k: h.get("k"), t: h.get("t"), n: h.get("n") || "Moo" });
      store.del("last");
    }
    history.replaceState(null, "", location.pathname);
  }
  const cfg = store.get("cfg", null);
  const prefs = Object.assign({ voice: true, auto: true }, store.get("prefs", {}));
  if (!cfg) return;
  document.body.classList.remove("unpaired");
  const NAME = cfg.n || "Moo";
  $("name").textContent = NAME.toLowerCase();
  document.title = NAME;
  $("text").placeholder = `Ask ${NAME} anything`;

  async function rpc(fn, params) {
    const r = await fetch(`${cfg.u}/rest/v1/rpc/${fn}`, {
      method: "POST", headers: { apikey: cfg.k, "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ p_token: cfg.t }, params || {})),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }
  const send = (kind, body, extra) => rpc("moo_post", Object.assign({ p_sender: "phone", p_kind: kind, p_body: body || "" }, extra || {}));

  // ---------- chat ----------
  const chat = $("chat");
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hhmm = (d) => (d ? new Date(d) : new Date()).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  let booting = true;
  function add(cls, html) {
    if (!booting) document.body.classList.add("chatting");
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.innerHTML = html;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }
  const addYou = (t) => add("you", esc(t));
  function addMoo(t, when, audio) {
    const el = add("moo", `<div class="who">${esc(NAME)}<time>${hhmm(when)}</time>${audio ? '<button class="replay">▶ replay</button>' : ""}</div>${esc(t)}`);
    if (audio) el.querySelector(".replay").onclick = () => play(audio);
    return el;
  }
  let typingEl = null;
  function typing(on) {
    if (on && !typingEl) typingEl = add("moo", '<div class="typing"><span></span><span></span><span></span></div>');
    if (!on && typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ---------- voice out ----------
  const player = new Audio();
  player.onplay = () => setState("speaking");
  player.onended = player.onpause = () => { if (state === "speaking") setState("idle"); };
  function play(b64) {
    try { player.src = "data:audio/mp4;base64," + b64; player.play().catch(() => setState("idle")); } catch { }
  }
  $("orbBtn").onclick = () => { if (!player.paused) { player.pause(); setState("idle"); } };

  // ---------- state ----------
  let state = "idle";
  function setState(s, text) {
    state = s;
    document.body.classList.remove("listening", "thinking", "speaking");
    if (s !== "idle") document.body.classList.add(s);
    $("status").textContent = text || { idle: "Tap the mic and talk", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking · tap me to stop" }[s];
  }

  // ---------- receiving ----------
  let last = store.get("last", 0);
  let waiting = 0;
  function handle(m) {
    last = Math.max(last, m.id); store.set("last", last);
    if (m.kind === "heard") {
      const mine = [...chat.querySelectorAll(".msg.you")].pop();
      if (mine && mine.dataset.voice === "1") { mine.textContent = m.body; mine.dataset.voice = ""; } else addYou(m.body);
      return;
    }
    if (m.kind === "text") {
      typing(false); waiting = Math.max(0, waiting - 1);
      addMoo(m.body, m.created, m.audio);
      if (m.audio && prefs.voice) play(m.audio); else setState("idle");
      if (waiting) typing(true);
    } else if (m.kind === "alert") {
      const el = add("alert", esc(m.body));
      if (m.audio && prefs.voice && state === "idle") play(m.audio);
    } else if (m.kind === "draft") {
      const el = add("draft", `<small><span>${esc((m.meta && m.meta.label) || "Draft")}</span><button class="copy">Copy</button></small>${esc(m.body)}`);
      el.querySelector(".copy").onclick = (e) => { navigator.clipboard && navigator.clipboard.writeText(m.body); e.target.textContent = "Copied"; };
    } else if (m.kind === "image" && m.audio) {
      add("moo", `<img alt="" src="data:${m.audio_mime || "image/png"};base64,${m.audio}">`);
    } else if (m.kind === "approval") {
      refreshState();
    }
  }
  async function poll() {
    try {
      const msgs = await rpc("moo_poll", { p_sender: "pc", p_after: last });
      online(true);
      (msgs || []).forEach(handle);
    } catch (e) { online(false); }
  }
  let timer = null;
  function schedule() {
    clearTimeout(timer);
    if (document.hidden) return;
    timer = setTimeout(async () => { await poll(); schedule(); }, waiting ? 900 : 3000);
  }

  // ---------- at a glance ----------
  let pcFresh = false;
  function online(ok) {
    const chip = $("chip");
    chip.className = "chip" + (ok && pcFresh ? "" : " off");
    chip.querySelector("span").textContent = ok ? (pcFresh ? "Online" : "PC asleep?") : "No signal";
  }
  async function refreshState() {
    try {
      const s = await rpc("moo_state_get");
      if (!s || !s.data) return;
      const d = s.data;
      pcFresh = (Date.now() - new Date(s.updated).getTime()) < 120000;
      online(true);
      $("gNext").textContent = d.next || "–";
      $("gInbox").textContent = d.inbox || "–";
      $("gRem").textContent = d.reminder || "–";
      const box = $("approvals");
      box.innerHTML = "";
      (d.approvals || []).forEach((a) => {
        const el = document.createElement("div");
        el.className = "ap";
        el.innerHTML = `<div class="t"><b>${esc(a.title)}</b><em>${esc(a.detail || "Waiting for your OK")}</em></div>` +
          (a.status === "running" ? `<em style="color:var(--think2);font-size:12px">Working…</em>` :
            `<button class="pill">Reject</button><button class="pill primary">Approve</button>`);
        const [rej, ok] = el.querySelectorAll("button");
        if (ok) ok.onclick = () => act(a, "approve", el);
        if (rej) rej.onclick = () => act(a, "reject", el);
        box.appendChild(el);
      });
    } catch (e) { online(false); }
  }
  async function act(a, action, el) {
    el.style.opacity = .5;
    try {
      await send("action", "", { p_meta: { id: a.id, action } });
      if (action === "approve") { waiting++; typing(true); setState("thinking"); add("sys", `Approved: ${esc(a.title)}`); }
      else add("sys", `Rejected: ${esc(a.title)}`);
      el.remove(); schedule();
    } catch (e) { el.style.opacity = 1; add("sys", "Couldn't reach Moo, try again."); }
  }

  // ---------- asking ----------
  async function ask(text) {
    text = (text || "").trim();
    if (!text) return;
    unlockAudio();
    addYou(text);
    $("text").value = ""; document.body.classList.remove("typed");
    waiting++; typing(true); setState("thinking");
    try { await send("text", text); schedule(); }
    catch (e) { typing(false); waiting--; setState("idle"); add("sys", "Couldn't send that, check your signal and try again."); }
  }
  $("text").addEventListener("input", (e) => document.body.classList.toggle("typed", !!e.target.value.trim()));
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(e.target.value); });
  $("send").onclick = () => ask($("text").value);
  document.querySelectorAll("[data-ask]").forEach((b) => (b.onclick = () => ask(b.dataset.ask)));

  let unlocked = false;
  function unlockAudio() {  // phones only allow sound after a tap: prime the player on the first one
    if (unlocked) return; unlocked = true;
    try { player.src = "data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQAAAAhmcmVlAAAAAA=="; player.play().catch(() => {}); } catch { }
  }

  // ---------- talking ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, media = null, chunks = [];
  async function startListening() {
    unlockAudio();
    if (!player.paused) player.pause();
    if (SR) {
      rec = new SR();
      rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = !prefs.auto; rec.maxAlternatives = 1;
      let final = "";
      rec.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
        }
        $("text").value = (final + interim).trim();
        document.body.classList.toggle("typed", !!$("text").value);
      };
      rec.onerror = (e) => { if (e.error === "not-allowed") add("sys", "Allow the microphone for this app in your browser settings."); };
      rec.onend = () => { rec = null; setState("idle"); if ($("text").value.trim()) ask($("text").value); };
      rec.start();
      setState("listening");
      return;
    }
    // no built-in speech recognition: record and let the PC transcribe
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      media = new MediaRecorder(stream);
      media.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      media.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: media.mimeType || "audio/webm" });
        media = null;
        const b64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
        const el = addYou("🎤 …"); el.dataset.voice = "1";
        waiting++; typing(true); setState("thinking");
        try { await send("voice", "", { p_audio: b64, p_mime: blob.type }); schedule(); }
        catch { typing(false); waiting--; setState("idle"); add("sys", "Couldn't send that, try again."); }
      };
      media.start();
      setState("listening", "Listening… tap again when you're done");
    } catch { add("sys", "Allow the microphone for this app in your browser settings."); }
  }
  function stopListening() {
    if (rec) rec.stop();
    if (media) media.stop();
  }
  $("mic").onclick = () => (state === "listening" ? stopListening() : startListening());

  // ---------- photos ----------
  $("cam").onclick = () => $("photo").click();
  $("photo").onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const img = await createImageBitmap(f);
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.85);
    const caption = $("text").value.trim();
    add("you", `<img alt="" src="${url}">` + (caption ? `<div style="margin-top:6px">${esc(caption)}</div>` : ""));
    $("text").value = ""; document.body.classList.remove("typed");
    waiting++; typing(true); setState("thinking");
    try { await send("photo", caption, { p_audio: url.split(",")[1], p_mime: "image/jpeg" }); schedule(); }
    catch { typing(false); waiting--; setState("idle"); add("sys", "Couldn't send the photo, try again."); }
  };

  // ---------- settings sheet ----------
  const sheet = $("sheet");
  function syncToggles() { $("tVoice").classList.toggle("on", prefs.voice); $("tAuto").classList.toggle("on", prefs.auto); }
  syncToggles();
  $("menuBtn").onclick = () => sheet.classList.add("open");
  $("closeSheet").onclick = () => sheet.classList.remove("open");
  $("tVoice").onclick = () => { prefs.voice = !prefs.voice; store.set("prefs", prefs); syncToggles(); };
  $("tAuto").onclick = () => { prefs.auto = !prefs.auto; store.set("prefs", prefs); syncToggles(); };
  $("unpair").onclick = () => { store.del("cfg"); store.del("last"); location.reload(); };

  // ---------- start ----------
  async function boot() {
    try {
      const hist = await rpc("moo_history", { p_limit: 30 });
      (hist || []).forEach((m) => {
        if (m.sender === "phone" && m.kind === "text") addYou(m.body);
        else if (m.sender === "pc" && m.kind === "text") addMoo(m.body, m.created);
        else if (m.sender === "pc" && m.kind === "alert") add("alert", esc(m.body));
      });
      if (!last) last = await rpc("moo_last_id");
      store.set("last", last);
      online(true);
    } catch (e) { online(false); }
    booting = false;
    refreshState();
    send("hello").catch(() => {});
    schedule();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshState(); poll().then(schedule); } });
  setInterval(() => { if (!document.hidden) refreshState(); }, 30000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  boot();
})();
</script>
</body>
</html>
